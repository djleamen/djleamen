name: Contribution garden

on:
  schedule:
    - cron: '17 3 * * *' # once a day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  garden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: NightingaleX03/github-contribution@v1
        with:
          github-token: ${{ secrets.GARDEN_TOKEN }}
